<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord — HackPsy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#eef1f8; --card:#ffffff; --card-soft:#f6f8fd; --ink:#1a1f2b; --mute:#6b7488; --line:#e3e7f0;
  --accent:#4c6ef5; --accent-2:#7c5cff; --warn:#e8872f; --bad:#e5484d; --good:#18a877;
  --shadow:0 1px 2px rgba(20,24,40,.04), 0 8px 24px -10px rgba(20,24,40,.12);
  --font-ui:'Inter',system-ui,sans-serif; --font-head:'Fraunces',serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0e14; --card:#141822; --card-soft:#191f2c; --ink:#e8ebf3; --mute:#8d96ab; --line:#262c3a;
    --accent:#8aa0ff; --accent-2:#a98cff; --warn:#f0a35c; --bad:#ff7a7d; --good:#3dd68c;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
body{margin:0;font:14.5px/1.55 var(--font-ui);background:var(--bg);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(900px 500px at 10% -10%, color-mix(in srgb,var(--accent) 9%,transparent), transparent 60%)}
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:11px 20px;
  border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center}
.mark svg{width:18px;height:18px;stroke:#fff}
.brand b{font:700 15.5px var(--font-head)} .brand small{display:block;font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.hdr-right{display:flex;align-items:center;gap:10px}
.bell{position:relative;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card-soft);
  display:flex;align-items:center;justify-content:center;color:var(--ink)}
.bell svg{width:16px;height:16px}
.bell .n{position:absolute;top:-6px;right:-6px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;
  font:700 10.5px/17px var(--font-ui);text-align:center;padding:0 4px;display:none}
.bell.has .n{display:block} .bell.has{animation:ringshake 3s infinite}
@keyframes ringshake{0%,92%,100%{transform:rotate(0)}94%{transform:rotate(10deg)}96%{transform:rotate(-9deg)}98%{transform:rotate(5deg)}}
a.home{font-size:12px;color:var(--mute);text-decoration:none} a.home:hover{color:var(--accent)}

main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px;max-width:1500px;margin:auto;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.plist{padding:10px;position:sticky;top:70px;max-height:calc(100vh - 90px);overflow:auto}
.plist h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:4px 8px 10px;font-weight:700}
.prow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:.12s}
.prow:hover{background:var(--card-soft)}
.prow.sel{background:var(--card-soft);border-color:var(--accent)}
.pav{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font:700 13px var(--font-ui);color:#fff}
.prow .nm{flex:1;min-width:0}
.prow .nm b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm span{font-size:11.5px;color:var(--mute)}
.pbadge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:99px}
.pbadge.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pbadge.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pbadge.crit{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.dot-new{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}

.detail{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
h3.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:0 0 12px;font-weight:700}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mute);padding:80px 20px;text-align:center}
.empty svg{width:40px;height:40px;opacity:.4}

.phead{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.phead .pav{width:52px;height:52px;font-size:19px}
.phead .t b{font:700 21px var(--font-head);display:block}
.phead .t span{font-size:12.5px;color:var(--mute)}
.phead .spacer{flex:1}
.ring-wrap{position:relative;flex:none}
.ring-wrap .lab{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 16px var(--font-ui)}
.ring-wrap .lab small{font:600 8.5px var(--font-ui);color:var(--mute);text-transform:uppercase;letter-spacing:.04em}

.alert{display:flex;gap:10px;padding:11px 14px;border-radius:12px;margin-bottom:8px;
  background:color-mix(in srgb,var(--warn) 9%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 28%,var(--line))}
.alert.crit{background:color-mix(in srgb,var(--bad) 10%,var(--card));border-color:color-mix(in srgb,var(--bad) 38%,var(--line))}
.alert svg{width:17px;height:17px;flex:none;stroke:var(--warn);margin-top:2px}
.alert.crit svg{stroke:var(--bad)}
.alert b{font-size:13.5px} .alert .meta{font-size:11.5px;color:var(--mute)}
.alert .quote{font-size:12.5px;font-style:italic;color:var(--mute);margin-top:3px;border-left:2px solid var(--line);padding-left:8px}

.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:9px}
.gauge{border:1px solid var(--line);border-radius:13px;padding:9px 5px;text-align:center;background:var(--card-soft)}
.gauge .rw{position:relative;width:58px;height:58px;margin:0 auto 5px}
.gauge .rl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 13.5px var(--font-ui)}
.gauge .name{font-size:10.5px;font-weight:600;color:var(--mute)}
.trend{font-size:10.5px;font-weight:700}
.trend.up{color:var(--bad)} .trend.down{color:var(--good)} .trend.flat{color:var(--mute)}
canvas{max-height:230px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1150px){.grid2{grid-template-columns:1fr}}
.transcript{max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.tmsg{padding:8px 12px;border-radius:12px;font-size:13px;max-width:92%}
.tmsg.user{align-self:flex-start;background:var(--card-soft);border:1px solid var(--line)}
.tmsg.assistant{align-self:flex-end;background:color-mix(in srgb,var(--accent) 9%,transparent);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.tmsg .ts{display:block;font-size:10px;color:var(--mute);margin-top:3px}
textarea{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card-soft);color:var(--ink);font:inherit;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
button{padding:9px 15px;border-radius:11px;border:1px solid transparent;font:600 13px var(--font-ui);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn-primary{background:linear-gradient(140deg,var(--accent),var(--accent-2));color:#fff}
.btn-primary:disabled{opacity:.6;cursor:wait}
.btn-ghost{background:var(--card-soft);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
#report{white-space:pre-wrap;font-size:13.5px;line-height:1.6}
.word{display:inline-block;padding:2px 8px;margin:2px;border-radius:7px;font-size:12px;font-weight:600}
.notice{font-size:11.5px;color:var(--mute);display:flex;gap:6px;align-items:center;margin-top:10px}
.notice svg{width:13px;height:13px;flex:none}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 7 4-14 2 7h6"/></svg></div>
    <div><b>Tableau de bord médecin</b><small>HackPsy Assistant</small></div>
  </div>
  <div class="hdr-right">
    <div class="bell" id="bell" title="Alertes non vues">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="n" id="bellN">0</span>
    </div>
    <a class="home" href="/">← Accueil</a>
  </div>
</header>

<main>
  <div class="panel plist">
    <h2>File active</h2>
    <div id="plist"></div>
  </div>

  <div class="detail" id="detail">
    <div class="card empty" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <b>Sélectionnez un patient</b>
      <span>Trajectoires, alertes et rapport de séance apparaîtront ici.</span>
    </div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const PAL = ['#4c6ef5','#0ea789','#e8872f','#7c5cff','#d6336c','#1098ad'];
let AXES = {}, curSid = null, chart = null;

async function api(p, body){
  const r = await fetch('/api/'+p, body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
const initials = n => n.split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
const avColor = n => PAL[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%PAL.length];
function ring(pct,color,size=58,stroke=6){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,pct)));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .6s"/>
  </svg>`;
}
const trendCls = s => s>0.03?['up','↗']:s<-0.03?['down','↘']:['flat','→'];
const fmtTs = ts => { const d=new Date(ts); return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); };

async function refreshList(){
  const ps = await api('doctor/patients');
  const unseen = ps.reduce((a,p)=>a+p.unseen_alerts,0);
  $('#bell').classList.toggle('has', unseen>0); $('#bellN').textContent = unseen;
  $('#plist').innerHTML = ps.map(p=>{
    const sev = p.critical?'crit':(p.active_alerts.length?'warn':'ok');
    const sevTxt = p.critical?'critique':(p.active_alerts.length? p.active_alerts.length+' alerte'+(p.active_alerts.length>1?'s':'') :'stable');
    return `<div class="prow ${p.session_id===curSid?'sel':''}" onclick="openPatient('${p.session_id}')">
      <div class="pav" style="background:${avColor(p.name)}">${initials(p.name)}</div>
      <div class="nm"><b>${p.name}</b><span>${p.n_messages} messages · ${fmtTs(p.updated)}</span></div>
      ${p.unseen_alerts?'<span class="dot-new" title="Nouvelles alertes"></span>':''}
      <span class="pbadge ${sev}">${sevTxt}</span>
    </div>`;
  }).join('');
}

async function openPatient(sid){
  curSid = sid;
  const d = await api('doctor/patient/'+sid);
  AXES = d.axes;
  const an = d.analysis;
  const idxColor = an.index>.55?'var(--bad)':an.index>.3?'var(--warn)':'var(--good)';

  $('#detail').innerHTML = `
    <div class="card phead">
      <div class="pav" style="background:${avColor(d.name)}">${initials(d.name)}</div>
      <div class="t"><b>${d.name}</b><span>Suivi depuis le ${fmtTs(d.created)} · dernier échange ${fmtTs(d.updated)}</span></div>
      <div class="spacer"></div>
      <div class="ring-wrap">${ring(an.index, idxColor, 74, 8)}<div class="lab">${(an.index*100).toFixed(0)}<small>indice</small></div></div>
    </div>

    <div class="card" id="alertCard" style="${d.alert_log.length?'':'display:none'}">
      <h3 class="sec">⚡ Alertes de seuil (${d.alert_log.length})</h3>
      <div id="alertList"></div>
    </div>

    <div class="card">
      <h3 class="sec">Trajectoires par axe</h3>
      <div class="gauges" id="gauges"></div>
      <canvas id="chart" style="margin-top:14px"></canvas>
      <div class="notice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        Scores descriptifs issus du langage — outil de suivi, en aucun cas un diagnostic.</div>
    </div>

    <div class="grid2">
      <div class="card">
        <h3 class="sec">Conversation</h3>
        <div class="transcript" id="transcript"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <div class="card">
          <h3 class="sec">Contexte clinique (conditionne l'IA)</h3>
          <textarea id="ctx" rows="4">${d.context||''}</textarea>
          <div style="margin-top:9px;display:flex;gap:8px">
            <button class="btn-ghost" id="saveCtx">Enregistrer le contexte</button>
          </div>
        </div>
        <div class="card">
          <h3 class="sec">Rapport de séance</h3>
          <button class="btn-primary" id="genReport">Générer le rapport IA</button>
          <div id="report" style="margin-top:12px" class="mute"></div>
        </div>
        <div class="card" id="explCard" style="display:none">
          <h3 class="sec">Mots déclencheurs (dernier message)</h3>
          <div id="expl"></div>
        </div>
      </div>
    </div>`;

  $('#alertList').innerHTML = [...d.alert_log].reverse().map(a=>`
    <div class="alert ${a.critical?'crit':''}">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <div><b>${a.label}</b> <span class="meta">· ${fmtTs(a.ts)} · niveau ${(a.level*100).toFixed(0)}%, pente +${a.slope.toFixed(3)}</span>
        <div class="quote">« ${a.message} »</div>
      </div>
    </div>`).join('');

  $('#gauges').innerHTML = Object.entries(an.levels).map(([k,v])=>{
    const [cls,arrow]=trendCls(v.slope);
    return `<div class="gauge"><div class="rw">${ring(v.level, AXES[k].color)}<div class="rl">${(v.level*100).toFixed(0)}</div></div>
      <div class="name">${AXES[k].label}</div><span class="trend ${cls}">${arrow} ${v.slope>=0?'+':''}${v.slope.toFixed(2)}</span></div>`;
  }).join('');

  const labels = Object.values(an.series)[0]?.ema.map((_,i)=>'M'+(i+1))||[];
  const mute = getComputedStyle(document.documentElement).getPropertyValue('--mute');
  const line = getComputedStyle(document.documentElement).getPropertyValue('--line');
  if(chart) chart.destroy();
  chart = new Chart($('#chart'),{type:'line',
    data:{labels, datasets:Object.entries(an.series).map(([k,s])=>({label:AXES[k].label,data:s.ema,
      borderColor:AXES[k].color,backgroundColor:AXES[k].color,tension:.35,pointRadius:2.5,borderWidth:2.2}))},
    options:{animation:{duration:400},
      scales:{y:{min:0,max:1,grid:{color:line},ticks:{color:mute}},x:{grid:{display:false},ticks:{color:mute}}},
      plugins:{legend:{position:'bottom',labels:{color:mute,boxWidth:9,usePointStyle:true,pointStyle:'circle'}}}}});

  $('#transcript').innerHTML = d.convo.map(m=>`
    <div class="tmsg ${m.role}">${m.content}<span class="ts">${m.role==='user'?d.name:'Assistant'} · ${fmtTs(m.ts)}</span></div>`).join('');
  const tr = $('#transcript'); tr.scrollTop = tr.scrollHeight;

  const last = d.explanations[d.explanations.length-1];
  if(last){
    const rows = Object.entries(last).filter(([k,w])=>w.length&&AXES[k]).map(([k,w])=>
      `<div style="margin-bottom:7px"><b style="color:${AXES[k].color};font-size:12.5px">${AXES[k].label}</b><br>`+
      w.map(x=>`<span class="word" style="background:color-mix(in srgb,${AXES[k].color} ${Math.round(18+55*Math.min(1,x.weight))}%,transparent);color:${AXES[k].color}">${x.word}</span>`).join('')+'</div>').join('');
    if(rows){ $('#explCard').style.display=''; $('#expl').innerHTML=rows; }
  }

  $('#saveCtx').onclick = async ()=>{
    await api('session',{session_id:sid, context:$('#ctx').value});
    $('#saveCtx').textContent='✓ Enregistré'; setTimeout(()=>$('#saveCtx').textContent='Enregistrer le contexte',1600);
  };
  $('#genReport').onclick = async ()=>{
    const b=$('#genReport'); b.disabled=true; b.textContent='Génération en cours…';
    try{ const r=await api('summary',{session_id:sid}); $('#report').textContent=r.summary; }
    catch(e){ $('#report').textContent='Erreur : '+e.message; }
    b.disabled=false; b.textContent='Générer le rapport IA';
  };
  refreshList();
}

refreshList();
setInterval(refreshList, 5000);
</script>
</body>
</html>
